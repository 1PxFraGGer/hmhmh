<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6fa"><title>Exam content hub</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#19243b;background:#f5f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.top{height:72px;background:white;border-bottom:1px solid #e4e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100% - 1180px)/2))}.brand{font-weight:750;font-size:18px;display:flex;align-items:center;gap:11px}.logo{background:#365ce5;color:white;border-radius:10px;padding:9px 12px}.badge{font-size:12px;color:#65728a;border:1px solid #e1e6ef;border-radius:20px;padding:7px 11px}main{max-width:1180px;margin:42px auto;padding:0 24px}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:1.7px;color:#365ce5;font-weight:750}h1{font-size:34px;letter-spacing:-1.2px;margin:9px 0}p{color:#758199}.sync{font-size:12px;text-align:right;color:#647089}.dot{display:inline-block;width:8px;height:8px;background:#e4a137;border-radius:50%;margin-right:7px}.ok .dot{background:#25a779}.notice{background:#fff7e8;border-left:3px solid #e1a43e;color:#725c31;border-radius:5px;padding:12px 15px;font-size:13px;margin-bottom:18px}.picker,.box{background:#fff;border:1px solid #e3e8f0;border-radius:13px}.picker{display:grid;grid-template-columns:1fr 2fr;gap:16px;padding:20px;margin-bottom:20px}label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}input,select{width:100%;border:1px solid #dfe5ee;background:#f9fafd;border-radius:8px;padding:11px 12px;color:#19243b}.layout{display:grid;grid-template-columns:250px 1fr;gap:20px}.box{padding:22px}.navhead{font-size:11px;letter-spacing:1.2px;color:#838ea3;font-weight:750;display:flex;justify-content:space-between;margin-bottom:13px}.nav{display:grid;gap:4px}.nav button{border:0;text-align:left;background:transparent;color:#65718a;padding:11px 12px;border-radius:8px}.nav button:hover{background:#f4f6fb}.nav button.active{background:#edf1ff;color:#3458dc;font-weight:700}.detail{padding:26px}.crumb{font-size:12px;color:#8490a6;margin-bottom:10px}h2{font-size:24px;margin:0 0 5px}.sub{font-size:12px;color:#8792a6}.head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8ecf2;padding-bottom:18px}.refresh{border:1px solid #dfe5ee;background:white;color:#58647b;border-radius:8px;padding:9px 12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.field{border:1px solid #e5e9f1;border-radius:9px;padding:16px;min-height:100px}.field.wide{grid-column:1/-1}.field h3{font-size:12px;color:#62718e;margin:0 0 12px}.value{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.empty{font-size:13px;color:#9aa4b6}.foot{font-size:12px;color:#8994a9;margin-top:18px}@media(max-width:720px){main{margin:28px auto;padding:0 15px}.intro{display:block}.sync{text-align:left;margin-top:18px}h1{font-size:28px}.picker{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}.detail{padding:19px}.badge{display:none}}
</style></head><body>
<header class="top"><div class="brand"><span class="logo">E</span>Exam content hub</div><span class="badge">Exam directory</span></header>
<main><div class="intro"><div><div class="eyebrow">EXAM DIRECTORY</div><h1>Every exam. One workspace.</h1><p>Choose an exam, then open a page to view its content.</p></div><div id="sync" class="sync"><span class="dot"></span><span id="status">Loading workbook…</span><div id="checked" style="margin-top:7px">Live updates check every minute</div></div></div>
<div id="notice" class="notice" hidden></div><section class="picker"><div><label for="search">Find an exam</label><input id="search" type="search" placeholder="Search exam names…"></div><div><label for="exam">Choose an exam <span id="total"></span></label><select id="exam"></select></div></section>
<div class="layout"><aside class="box"><div class="navhead">PAGES <span id="count"></span></div><nav id="pages" class="nav" aria-label="Pages"></nav></aside><section class="box detail"><div id="crumb" class="crumb"></div><div class="head"><div><h2 id="title"></h2><div class="sub">Page content from Google Sheets</div></div><button id="refresh" class="refresh">↻ Refresh</button></div><div id="fields" class="fields"></div><div class="foot">Updates appear automatically while the page is open.</div></section></div></main>
<script>
// Deploy the supplied Apps Script and paste its /exec URL below.
const API_URL='https://script.google.com/macros/s/AKfycbzQ01mEjC4-6GzfmNOHuyyIo9OrZTqr10iPdo2AI4YpAIwBRnW3WNlQ6hRHQcBhIKSzIg/exec';
let data={exams:[]},examId='',pageName='',busy=false;
const $=id=>document.getElementById(id);
function filtered(){const q=$('search').value.toLowerCase();return data.exams.filter(e=>e.name.toLowerCase().includes(q)||e.tab.toLowerCase().includes(q));}
function render(){const list=filtered();if(!list.some(e=>e.id===examId))examId=list[0]?.id||'';$('exam').replaceChildren(...list.map(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.name;return o;}));$('exam').value=examId;$('total').textContent=`(${data.exams.length})`;const exam=list.find(e=>e.id===examId),pages=exam?.pages||[];if(!pages.some(p=>p.name===pageName))pageName=pages[0]?.name||'';$('count').textContent=pages.length;$('pages').replaceChildren(...pages.map(p=>{const b=document.createElement('button');b.textContent=p.name;b.className=p.name===pageName?'active':'';b.onclick=()=>{pageName=p.name;render();};return b;}));$('crumb').textContent=exam?.name||'Exam';$('title').textContent=pageName||'No pages found';$('fields').replaceChildren();const p=pages.find(x=>x.name===pageName);if(!p){$('fields').textContent='No pages found for this exam.';return;}for(const [label,value] of Object.entries(p.fields)){const card=document.createElement('article');card.className='field'+(/description|structure/i.test(label)?' wide':'');const h=document.createElement('h3');h.textContent=label;const v=document.createElement('div');v.className=value?'value':'empty';v.textContent=value||'No entry yet';card.append(h,v);$('fields').append(card);}}
function receive(payload){if(!payload||!Array.isArray(payload.exams))throw Error('Unexpected sheet response');data=payload;render();$('notice').hidden=true;$('sync').classList.add('ok');$('status').textContent='Connected to Google Sheets';$('checked').textContent='Last checked '+new Date().toLocaleTimeString()+' · every 60 seconds';}
function jsonp(){return new Promise((resolve,reject)=>{const cb='sheetReply_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const timer=setTimeout(()=>finish(new Error('Google Sheets request timed out')),20000);function finish(err,value){clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(value);}window[cb]=v=>finish(null,v);script.onerror=()=>finish(new Error('Cannot reach Google Sheets. Check the Apps Script URL and deployment access.'));script.src=API_URL+(API_URL.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now();document.head.append(script);});}
async function refresh(){if(busy)return;if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL)){$('notice').hidden=false;$('notice').textContent='Add your Apps Script web app URL in index.html to connect live Google Sheets data.';$('status').textContent='Setup needed';return;}busy=true;$('refresh').disabled=true;$('status').textContent='Checking Google Sheets…';try{receive(await jsonp());}catch(e){$('sync').classList.remove('ok');$('status').textContent='Sync unavailable';$('notice').hidden=false;$('notice').textContent=(e.message||String(e))+' Showing the last loaded data.';}finally{busy=false;$('refresh').disabled=false;}}
$('search').oninput=render;$('exam').onchange=()=>{examId=$('exam').value;pageName='';render();};$('refresh').onclick=refresh;fetch('./data.json').then(r=>{if(!r.ok)throw Error('Workbook preview unavailable');return r.json();}).then(d=>{data=d;render();$('status').textContent='Workbook preview';}).catch(()=>{}).finally(refresh);setInterval(()=>{if(!document.hidden)refresh();},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
</script></body></html>
